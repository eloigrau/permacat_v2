{% load app_filters %}
{% load widget_tweaks %}
<div class="row justify-content-center">
    <div class="col-sm-12 col-md-10 col-lg-8 form_class">
        <form id="myForm" method="post">
            {% csrf_token %}
            {% include 'form_template2.html' with nolabel_summernote=nolabel_summernote %}
            <div class="form-group textright">
                {% if not boutonAnnuler %}
                <input class="btn btn-secondary" onclick="window.history.back();" type="button" value="Annuler"/>
                {% endif %}
                <button class="btn btn-primary" id="btn-valider" type="submit">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
<script>
$(document).ready(function() {
    $('#myForm').one('submit', function() {
        var btn = $("#btn-valider");
        btn.prop("disabled", true);
        btn.html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>');

        setTimeout(function () {
             btn.removeAttr("disabled")
             btn.html( `veuillez patientez...` );
          }, 60000);
    });

    $(function() {
        // Enable on all forms
        $('myForm').areYouSure();
    });
});

</script>
